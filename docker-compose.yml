services:
    postgres:
        image: postgres:16
        container_name: apple_health_postgres
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
            POSTGRES_DB: apple_health_export_db
        ports:
            - "5444:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
